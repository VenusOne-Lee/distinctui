<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Try distinctUI+ · distinctUI</title>
<meta name="description" content="A WordPress in your browser with the distinctUI theme and the distinctUI+ builder. Nothing is saved; close the tab and it's gone.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#000;font:400 16px/1.5 "Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:48px 16px}
.card{max-width:34rem;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.mark{width:72px;height:72px;border-radius:50%;border:5px dashed #1f3bff}
h1{font-weight:300;font-size:clamp(2.25rem,6vw,3.5rem);line-height:1.05;letter-spacing:-0.04em;margin:0}
h1 b{font-weight:700}
p{margin:0;color:#525252}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.pill,.ghost{display:inline-flex;align-items:center;min-height:44px;padding:0 22px;border-radius:999px;text-decoration:none;font-weight:600;border:1px solid #000;transition:border-color 120ms cubic-bezier(.2,0,0,1)}
.pill{background:#000;color:#fff}
.ghost{background:#fff;color:#000;border-color:#e5e5e5}
.ghost:hover{border-color:#000}
.pill:focus-visible,.ghost:focus-visible{outline:2px solid #000;outline-offset:3px}
.meta{font-size:14px;color:#6b6b6b}
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="mark" aria-hidden="true"></span>
    <h1>Try distinctUI<b>+</b></h1>
    <p>A real WordPress opens in your browser with the free theme and the distinctUI+ builder. Type your content, pick one of three designs, and edit right on the page.</p>
    <div class="acts">
      <a class="pill" id="go" href="https://playground.wordpress.net/">Open the demo</a>
      <a class="ghost" href="https://distinctui.com/#wordpress">Get the free theme</a>
    </div>
    <p class="meta">It takes about 20 seconds to start. Nothing is saved: close the tab and it's gone.</p>
  </div>
</main>
<script>
// WordPress Playground runs WordPress in the browser. The blueprint installs the free
// theme and distinctUI+ from this site, then opens the canvas. DUI_PLUS_DEV skips the
// licence for the demo only. It opens as its own page: inside a frame, Playground's
// browser check can't run.
const here = location.origin;
const blueprint = {
  landingPage: "/wp-admin/admin.php?page=dui-canvas",
  preferredVersions: { php: "8.3", wp: "latest" },
  login: true,
  steps: [
    { step: "installTheme", themeData: { resource: "url", url: here + "/try/distinctui-wordpress.zip" }, options: { activate: true } },
    { step: "installPlugin", pluginData: { resource: "url", url: here + "/try/distinctui-plus.zip" }, options: { activate: true } },
    { step: "defineWpConfigConsts", consts: { DUI_PLUS_DEV: true } },
    { step: "setSiteOptions", options: { blogname: "Loaf", blogdescription: "Fresh bread before you're up" } },
  ],
};
document.getElementById("go").href = "https://playground.wordpress.net/#" + encodeURIComponent(JSON.stringify(blueprint));
</script>
</body>
</html>
