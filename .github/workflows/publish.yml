# Publishes distinctui to npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC), so no npm token is stored here.
# One-time setup on npmjs.com: package settings → Trusted publishing →
# GitHub Actions, repository VenusOne-Lee/distinctui, workflow publish.yml.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - run: npm publish
